name: Post YouTube Short

on:
  schedule:
    # 5x/day across peak engagement windows (times are ET / UTC-4 EDT).
    # Restored from 2x/day on 2026-07-26: the May 14 cut to 2x was paired with a
    # dedup fix that never actually worked (title history was being clobbered by
    # concurrent jobs), so it bought a 60% output cut for no quality gain.
    # Uploads cost 1600 quota units each; 5/day = 8000 of the 10000 daily limit.
    - cron: "0 12 * * *"   #  8:00 AM ET — morning commute
    - cron: "0 15 * * *"   # 11:00 AM ET — midday scroll
    - cron: "0 18 * * *"   #  2:00 PM ET — afternoon break
    - cron: "0 22 * * *"   #  6:00 PM ET — evening wind-down
    - cron: "0 1 * * *"    #  9:00 PM ET — late night scroll
  workflow_dispatch:        # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  post-short:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Write credentials from secrets
        run: |
          mkdir -p data
          echo '${{ secrets.YOUTUBE_CLIENT_SECRET }}' > data/client_secret.json
          echo '${{ secrets.YOUTUBE_TOKEN }}' > data/youtube_token.json

      - name: Post one YouTube Short
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Not a frontier model on purpose — see src/config.py. DeepSeek averaged
          # 58 chars against Opus 5's 94 and Sonnet 5's 115 on identical prompts,
          # and the task is compression. Override with an LLM_MODEL repo variable
          # to run a different writer as an A/B arm.
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek/deepseek-chat-v3-0324' }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL || 'anthropic/claude-haiku-4.5' }}
          CANDIDATES_PER_POST: ${{ vars.CANDIDATES_PER_POST || '6' }}
          YOUTUBE_CHANNEL_NAME: MASTERING MONEY
          YOUTUBE_HANDLE: "@masteringmoneyxyz"
          YOUTUBE_VIDEO_DURATION: "10"
          ELEVENLABS_ENABLED: "false"
          TIMEZONE: America/New_York
          # Image engine is ON in CI. The default in src/config.py stays false so
          # local previews do not spend money on every run — CI opts in here.
          # Kill switch: set an IMAGE_ENGINE_ENABLED repo variable to "false";
          # a set variable wins over this default.
          IMAGE_ENGINE_ENABLED: ${{ vars.IMAGE_ENGINE_ENABLED || 'true' }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'bytedance-seed/seedream-4.5' }}
          IMAGE_BACKGROUND_RATIO: ${{ vars.IMAGE_BACKGROUND_RATIO || '0.5' }}
          # Seedream does not support n>1 on OpenRouter — asking for 2 returns 1,
          # so best-of-N would need sequential calls. Keep at 1 until that is worth
          # the extra spend; the gate can currently accept or reject, not choose.
          IMAGE_CANDIDATES: ${{ vars.IMAGE_CANDIDATES || '1' }}
          # -lite suffix matters: plain `google/gemini-3.1-flash` is not a valid
          # OpenRouter slug and 400s, which the gate treats as fail-open — a dead
          # gate that reports nothing. Verified against their live model list.
          VISION_MODEL: ${{ vars.VISION_MODEL || 'google/gemini-3.1-flash-lite' }}
        run: python run_youtube.py post

      - name: Commit updated title history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # post_variants.json is the attribution log — if it is not committed,
          # the hook-archetype scoring has nothing to join against.
          git add data/posted_titles.json data/post_variants.json
          git diff --cached --quiet && exit 0
          git commit -m "Auto-update posted titles and variant log after upload"
          # Rebase onto any commit the analytics job or the other daily slot
          # pushed while this run was working. Without this, the push either
          # fails or lands on a stale base and silently drops their titles —
          # which is how the anti-repetition memory kept losing entries.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $i failed, retrying..."
            sleep $((i * 5))
          done
          echo "::error::Could not push title history after 5 attempts"
          exit 1
